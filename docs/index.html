<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; frame-src 'self' data: blob:; connect-src 'self' data: blob:;">
<title>IT-Tech — Computer Class Manager</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bg">
  <div class="bg-blob b1"></div><div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div><div class="bg-blob b4"></div>
  <video id="bgVideo" autoplay muted loop playsinline></video>
  <div id="bgPhoto"></div>
  <canvas id="bgCanvas"></canvas>
</div>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="lg-wrap glass liquid">
    <img class="logo" data-asset="logo.png" src="assets/logo.png" alt="IT-Tech">
    <div class="brand-title" id="brandTitle">IT-Tech</div>
    <div class="brand-sub">Learn Today · Build Tomorrow</div>

    <div id="loginForm">
      <label class="f">Username</label>
      <input class="inp" id="luser" placeholder="Enter username" autocomplete="off">
      <label class="f">Password</label>
      <input class="inp" id="lpass" type="password" placeholder="Enter password">
      <div style="height:16px"></div>
      <button class="btn primary wide" id="btnLogin">🔓 Login</button>
      <div style="height:9px"></div>
      <button class="btn wide" id="btnShowCreate">➕ Create Username &amp; Password</button>
      <div style="height:9px"></div>
      <button class="btn purple wide" id="btnGuest">👤 Continue Without Username</button>
    </div>

    <div id="createForm" style="display:none">
      <label class="f">Full Name</label><input class="inp" id="cname" placeholder="Your name">
      <label class="f">Username</label><input class="inp" id="cuser" placeholder="Choose a username" autocomplete="off">
      <label class="f">Password</label><input class="inp" id="cpass" type="password" placeholder="Choose a password">
      <label class="f">Confirm Password</label><input class="inp" id="cpass2" type="password" placeholder="Repeat password">
      <div style="height:16px"></div>
      <button class="btn primary wide" id="btnCreate">✅ Create Account</button>
      <div style="height:9px"></div>
      <button class="btn ghost wide" id="btnBackLogin">← Back to Login</button>
    </div>

    <div id="loginMsg" style="margin-top:12px;font-size:12.5px;text-align:center;min-height:18px;color:#ffa8b8"></div>
    <div style="margin-top:12px;text-align:center">
      <button class="btn sm ghost" id="loginTheme">🌗 Theme</button>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" style="display:none">
  <aside id="sidebar" class="glass liquid">
    <div class="side-head">
      <img data-asset="logo.png" src="assets/logo.png" alt="">
      <div class="txt"><div class="t" id="sideName">IT-Tech</div><div class="s">CLASS MANAGER</div></div>
    </div>
    <div class="nav-scroll" id="nav"></div>
    <div class="side-foot"></div>
  </aside>

  <section id="main">
    <div id="topbar" class="glass">
      <button class="btn sm ghost" id="btnCollapse" title="Toggle sidebar"><span id="menuIco"></span></button>
      <div id="globalSearch">
        <span class="si" id="searchIco"></span>
        <input id="searchInput" placeholder="Search students, teachers, courses, pages…">
        <div id="searchResults" class="glass"></div>
      </div>
      <button class="btn sm" id="btnTheme" title="Light / Dark"><span id="themeIco"></span><span>Dark</span></button>
      <button class="btn sm" id="btnBg" title="Background manager"><span id="bgIco"></span></button>
      <button class="btn sm" id="btnBackupQuick" title="Quick backup"><span id="bkIco"></span></button>
      <button class="btn sm gold" id="btnCustomize"><span id="czIco"></span> Customize</button>
    </div>
    <div id="content"></div>
  </section>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script src="web-shim.js"></script>
<script src="data.js"></script>
<script src="icons.js"></script>
<script src="ui.js"></script>
<script src="pages.js"></script>
<script src="pages2.js"></script>
<script src="app.js"></script>
</body>
</html>
